<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Score - CBT Al Ishlah</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <style>
        :root {
            --primary: #0F5A3E; 
            --secondary: #D4AF37; 
            --bg: #F5F7F6;
            --surface: #FFFFFF;
            --text-light: #7F8C8D;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            margin: 0; padding: 2rem;
            color: #2C3E50;
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .header h1 {
            color: var(--primary);
            margin: 0 0 0.5rem 0;
            font-size: 3rem;
        }
        .header h3 {
            color: var(--secondary);
            margin: 0;
            font-size: 1.5rem;
        }
        .scoreboard-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }
        .cabang-card {
            background: var(--surface);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.05);
            overflow: hidden;
            transition: all 0.3s;
        }
        .cabang-card.active-focus {
            transform: translateY(-5px);
            box-shadow: 0 12px 32px rgba(15, 90, 62, 0.15);
            border: 2px solid var(--secondary);
        }
        .cabang-header {
            background: var(--primary);
            color: white;
            padding: 1rem;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
        }
        .table-wrap {
            padding: 1rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        th {
            color: var(--text-light);
            text-transform: uppercase;
            font-size: 0.85rem;
        }
        tr:nth-child(1) td:nth-child(1) { color: #FFD700; font-weight: bold; font-size: 1.2rem; }
        tr:nth-child(2) td:nth-child(1) { color: #C0C0C0; font-weight: bold; font-size: 1.1rem; }
        tr:nth-child(3) td:nth-child(1) { color: #CD7F32; font-weight: bold; font-size: 1.1rem; }
        .score-val {
            font-weight: 700;
            color: var(--primary);
            font-size: 1.2rem;
        }
        .status-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: var(--primary);
            color: white;
            padding: 0.5rem 2rem;
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            z-index: 10;
        }
        
        @media(max-width: 900px) {
            .scoreboard-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div style="display: flex; justify-content: center; gap: 1rem; margin-bottom: 1rem;">
            <img src="https://iili.io/CNu9Bt9.png" alt="Logo Yayasan" style="height: 80px;">
            <img src="https://iili.io/n17L7Q2.png" alt="Logo Milad 2026" style="height: 80px;">
        </div>
        <h1 id="event-name">Olimpiade Al Ishlah</h1>
        <h3>Live Scoreboard</h3>
    </div>

    <div class="scoreboard-container" id="boards">
        <!-- Generated by JS -->
    </div>

    <div class="status-bar">
        <div id="conn-status">🟡 Menghubungkan ke server...</div>
        <div id="last-update">Terakhir diperbarui: -</div>
    </div>

    <script src="js/scoreboard.js"></script>
</body>
</html>
